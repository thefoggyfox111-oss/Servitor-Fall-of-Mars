name: ForgeCell Engine Android APK
on:
  push:
    branches:
      - forgecell-engine-v0.15.0
      - forgecell-engine-v0.15.2
      - forgecell-engine-v0.16.0
      - forgecell-engine-v0.16.1
      - forgecell-engine-v0.16.2
      - forgecell-engine-v0.16.3
      - forgecell-engine-v0.16.4
      - forgecell-engine-v0.16.5
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ForgeCell Engine 0.15.0
        run: unzip -q forgecell/ForgeCell_Engine_0.15.0_source.zip
      - name: Fix GameActivity launch theme and enable emulator ABI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("ForgeCell_Engine/android/app")
          styles=root/"src/main/res/values/styles.xml"
          data=styles.read_text()
          old='parent="@android:style/Theme.Material.NoActionBar"'
          assert old in data, "Expected obsolete theme was not found"
          styles.write_text(data.replace(old,'parent="Theme.AppCompat.DayNight.NoActionBar"'))
          gradle=root/"build.gradle.kts"
          text=gradle.read_text()
          old='abiFilters += "arm64-v8a"'
          assert old in text, "Expected ABI declaration was not found"
          gradle.write_text(text.replace(old,'abiFilters += listOf("arm64-v8a", "x86_64")'))
          PY
      - name: Fix GameActivity JNI startup and bump version
        run: python3 forgecell/patch_startup_0152.py
      - name: Install authored Level 01 geometry, enemies and objects
        run: python3 forgecell/apply_level_0160.py
      - name: Instrument OpenGL and frame loop for black-screen diagnosis
        run: python3 forgecell/diagnose_black_screen_0161.py
      - name: Prevent Android event-loop render starvation
        run: python3 forgecell/fix_render_loop_0162.py
      - name: Improve jump reach and four-zone environment renderer
        run: python3 forgecell/apply_0163.py
      - name: Apply ForgeCell 0.16.4 death, restart and art improvements
        run: |
          python3 - <<'PY'
          import base64, zlib, subprocess
          from pathlib import Path
          encoded=Path('forgecell/upgrade_0164.b85').read_text().strip()
          assert len(encoded)==9355, "Incomplete patch payload"
          patch=zlib.decompress(base64.b85decode(encoded))
          subprocess.run(['patch','--batch','-p1'],input=patch,cwd='ForgeCell_Engine',check=True)
          print('ForgeCell 0.16.4 patch applied:',len(patch),'bytes')
          PY
      - name: Apply ForgeCell 0.16.5 fixes and texture renderer
        run: |
          patch --batch -p1 -d ForgeCell_Engine < forgecell/upgrade_0165.patch
          python3 -m pip install --quiet pillow
          python3 ForgeCell_Engine/tools/generate_fallback_environment.py
          test -s ForgeCell_Engine/android/app/src/main/assets/environment.fcex
      - name: Restore artwork supplied for the first demo level
        run: python3 forgecell/decode_reference_atlas_0165.py
      - name: Verify source archive
        run: |
          echo '043bfff795aca81305abbe4de66c7bc9d23a83c424d9cfdbfafbc39084983bbc  forgecell/ForgeCell_Engine_0.15.0_source.zip' | sha256sum -c -
          test -f ForgeCell_Engine/android/app/src/main/cpp/CMakeLists.txt
          test -f ForgeCell_Engine/android/app/src/main/assets/atlas.rgba
      - name: Verify updated Level 01 assets and native tests
        run: |
          cmake -S ForgeCell_Engine -B forgecell-host-build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFORGECELL_BUILD_TESTS=ON
          cmake --build forgecell-host-build --parallel 4
          ctest --test-dir forgecell-host-build --output-on-failure
      - name: Archive verified 0.16.5 cloud-build source
        run: zip -qr ForgeCell_Engine_0.16.5_cloud_source.zip ForgeCell_Engine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble ForgeCell debug APK
        working-directory: ForgeCell_Engine/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify GameActivity JNI entrypoint is exported
        run: |
          set -e
          SO="ForgeCell_Engine/android/app/build/intermediates/cxx/Debug"
          find "$SO" -name libforgecell.so | head -1 | xargs -r readelf -Ws | grep -F Java_com_google_androidgamesdk_GameActivity_initializeNativeCode
      - name: Verify APK native library and assets
        run: python3 ForgeCell_Engine/tools/check_apk.py ForgeCell_Engine/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test Android startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install ForgeCell_Engine/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.forgecell.engine/.MainActivity
            sleep 12
            adb logcat -d > forgecell-startup-logcat.txt
            grep -q 'Environment atlas loaded' forgecell-startup-logcat.txt || (echo 'Environment texture did not initialize'; tail -100 forgecell-startup-logcat.txt; exit 1)
            adb shell pidof com.forgecell.engine || (grep -E 'FATAL EXCEPTION|AndroidRuntime|ForgeCell|Fatal signal' forgecell-startup-logcat.txt | tail -100; exit 1)
            adb shell screencap -p /sdcard/forgecell-smoke.png
            adb pull /sdcard/forgecell-smoke.png forgecell-smoke.png
            echo 'Startup smoke test passed: application process remains alive'
      - name: Verify visible Android frame (not black)
        run: |
          python3 -m pip install -q Pillow
          python3 - <<'PY'
          from PIL import Image
          image=Image.open("forgecell-smoke.png").convert("RGB")
          hist=image.getcolors(image.width*image.height)
          assert hist and len(hist)>5, "All-black or solid-color Android screenshot"
          colored=sum(n for n,color in hist if max(color)>24)
          assert colored>image.width*image.height//100, f"Only {colored} visible pixels"
          print("Visible game pixels:",colored,"colors:",len(hist))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForgeCell-startup-logcat
          path: forgecell-startup-logcat.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForgeCell-0.16.5-textured-demo-apk
          path: ForgeCell_Engine/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForgeCell-0.16.5-screen
          path: forgecell-smoke.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForgeCell-0.16.5-cloud-source
          path: ForgeCell_Engine_0.16.5_cloud_source.zip
          if-no-files-found: ignore
