<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;background:#0b0709;color:#f5c49a;font:16px monospace;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}.pad{position:absolute;bottom:12px;display:flex;gap:10px}.left{left:15px}.right{right:15px}button{background:#402b2b;color:#fff;border:2px solid #b87751;border-radius:9px;width:64px;height:64px;font-size:24px;touch-action:none}#msg{position:absolute;top:12%;width:100%;text-align:center;pointer-events:none;text-shadow:2px 2px #000}</style></head><body><canvas id="c" width="960" height="540"></canvas><div id="msg">МАРС: ПРОРВИСЬ К ВРАТАМ ХРАМА</div><div class="pad left"><button data-k="l">◀</button><button data-k="r">▶</button></div><div class="pad right"><button data-k="j">▲</button><button data-k="a">⚔</button></div><script>
const c=document.getElementById('c'),g=c.getContext('2d'),keys={},W=3400,G=450;
let p={x:60,y:350,vx:0,vy:0,hp:100,face:1,cd:0,inv:0},win=false,dead=false,cam=0,frame=0;
const platforms=[{x:0,y:G,w:W,h:90},{x:360,y:365,w:170,h:20},{x:780,y:335,w:200,h:20},{x:1250,y:370,w:200,h:20},{x:1820,y:330,w:220,h:20},{x:2450,y:360,w:180,h:20}];
const enemies=[350,620,930,1200,1520,1830,2110,2420,2750,3050].map((x,i)=>({x,y:G-(i%3===2?74:52),hp:i%3===2?5:2,big:i%3===2,dir:-1,cd:0,home:x}));
document.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});
onkeydown=e=>{keys[{ArrowLeft:'l',ArrowRight:'r',ArrowUp:'j',Space:'j',KeyZ:'a'}[e.code]||e.code]=true};onkeyup=e=>{keys[{ArrowLeft:'l',ArrowRight:'r',ArrowUp:'j',Space:'j',KeyZ:'a'}[e.code]||e.code]=false};
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x-cam),Math.round(y),w,h)}
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){if(win||dead)return;frame++;p.vx=((keys.r?1:0)-(keys.l?1:0))*4;if(p.vx)p.face=Math.sign(p.vx);p.x=Math.max(0,Math.min(W-30,p.x+p.vx));p.vy+=.65;let old=p.y;p.y+=p.vy;let grounded=false;for(const q of platforms)if(p.x+28>q.x&&p.x<q.x+q.w&&old+52<=q.y+12&&p.y+52>=q.y&&p.vy>=0){p.y=q.y-52;p.vy=0;grounded=true}if(keys.j&&grounded)p.vy=-13;if(p.cd>0)p.cd--;if(p.inv>0)p.inv--;if(keys.a&&p.cd===0){p.cd=22;for(const e of enemies)if(e.hp>0&&Math.abs(e.x-p.x)<75&&Math.abs(e.y-p.y)<72&&(e.x-p.x)*p.face>-25)e.hp--}for(const e of enemies){if(e.hp<=0)continue;e.cd--;if(Math.abs(e.x-p.x)<300){e.dir=p.x<e.x?-1:1;e.x+=e.dir*(e.big?.65:1.1)}else{e.x+=e.dir*.4;if(Math.abs(e.x-e.home)>75)e.dir*=-1}if(Math.abs(e.x-p.x)<34&&Math.abs(e.y-p.y)<58&&e.cd<=0&&p.inv<=0){p.hp-=e.big?25:12;p.inv=35;e.cd=40;if(p.hp<=0)dead=true}}if(p.x>3260)win=true;cam=Math.max(0,Math.min(W-960,p.x-260));}
function draw(){g.fillStyle='#180e15';g.fillRect(0,0,960,540);for(let i=0;i<65;i++){let x=(i*137+20)%960,y=(i*71)%360;g.fillStyle=i%3?'#9d4840':'#c07051';g.fillRect(x,y,2,2)}g.fillStyle='#5e272a';g.beginPath();g.arc(755,135,78,0,7);g.fill();for(let x=0;x<W;x+=160){rect(x,240,100,210,'#28191f');rect(x+18,270,18,160,'#49262b');rect(x+60,270,18,160,'#49262b')}for(const q of platforms){rect(q.x,q.y,q.w,q.h,'#48353a');rect(q.x,q.y,q.w,8,'#b66b49');for(let x=q.x;x<q.x+q.w;x+=32)rect(x,q.y+15,4,18,'#6b4d49')}rect(3280,235,95,215,'#8b654d');rect(3300,285,55,165,'#231820');rect(3280,225,95,18,'#d7a85e');for(const e of enemies){if(e.hp<=0)continue;rect(e.x,e.y,e.big?40:25,e.big?74:52,e.big?'#553c70':'#6d303c');rect(e.x+5,e.y+8,e.big?30:15,12,e.big?'#ad94c5':'#e1b3a0');rect(e.x-8,e.y+26,10,5,'#c9a8a4');rect(e.x+4,e.y-7,16,9,'#39303a')}if(p.inv%6<3){rect(p.x,p.y+10,29,42,'#797d79');rect(p.x+5,p.y,20,18,'#b0a69a');rect(p.x+18,p.y+5,6,5,'#d43d2b');rect(p.x-7,p.y+21,9,22,'#6e5754');rect(p.x+27,p.y+23,9,20,'#a6a8a1');if(p.cd>12)rect(p.x+(p.face>0?31:-49),p.y+7,48,7,'#e1c5a0')}g.fillStyle='#e9d2b5';g.font='bold 22px monospace';g.fillText('SERVITOR  HP '+Math.max(0,p.hp),18,30);g.fillText('MARS // TEMPLE GATE →',570,30);if(win||dead){g.fillStyle='#120b0bdd';g.fillRect(0,0,960,540);g.fillStyle='#f2b86e';g.font='bold 42px monospace';g.fillText(win?'ХРАМ ДОСТИГНУТ':'СЕРВИТОР УНИЧТОЖЕН',150,250);g.font='22px monospace';g.fillText('Перезапусти игру для новой попытки',230,300)}}function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
