<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Servitor: Fall of Mars</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100c16;touch-action:none;font-family:monospace}
canvas{display:block;width:100vw;height:100vh;object-fit:fill;image-rendering:pixelated}
.controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;pointer-events:none;padding:0 max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.cluster{display:flex;gap:10px;align-items:flex-end}
.control{pointer-events:auto;touch-action:none;user-select:none;width:70px;height:70px;border:2px solid #c3815b;border-radius:12px;background:linear-gradient(145deg,#46313aDD,#211922EB);color:#f3cda1;font-size:29px;box-shadow:0 6px 0 #100d13,0 0 14px #e0804b25,inset 0 0 0 2px #ffffff13}
.control:active,.control.pressed{transform:translateY(3px);background:#94533e;box-shadow:0 2px 0 #100d13}
#attack{width:74px;height:74px;border-color:#e9ae73;background:linear-gradient(145deg,#69402e,#332024)}
#shoot{width:74px;height:74px;border-color:#8ac8ce;background:linear-gradient(145deg,#29565c,#172c35)}
#retry{position:fixed;top:60%;left:50%;transform:translateX(-50%);padding:15px 32px;display:none;z-index:3;background:#6a342e;color:#ffe5b8;border:2px solid #f2b27b;font:bold 18px monospace}
@media(max-width:650px){.control{width:59px;height:59px}.control#attack,.control#shoot{width:64px;height:64px}.cluster{gap:7px}}
</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="Servitor: Fall of Mars"></canvas>
<div class="controls">
<div class="cluster"><button class="control" data-key="left" aria-label="Влево">◀</button><button class="control" data-key="right" aria-label="Вправо">▶</button></div>
<div class="cluster"><button class="control" data-key="jump" aria-label="Прыжок">▲</button><button class="control" id="attack" data-key="attack" aria-label="Меч">⚔</button><button class="control" id="shoot" data-key="shoot" aria-label="Стрелять">✦</button></div>
</div>
<button id="retry">ПОВТОРИТЬ</button>
<script src="sprites.js"></script>
<script src="architecture.js"></script>
<script>
'use strict';
const canvas=document.querySelector('#game'),g=canvas.getContext('2d',{alpha:false});
g.imageSmoothingEnabled=false;
const SW=960,SH=540,LENGTH=3400,FLOOR=451,keys={left:false,right:false,jump:false,attack:false,shoot:false};
const restartBtn=document.querySelector('#retry');
const buildings=MarsArchitecture.buildings;
const landings=[
 {x:0,y:FLOOR,w:LENGTH,h:100},
 {x:365,y:359,w:160,h:20},{x:790,y:330,w:196,h:20},
 {x:1260,y:360,w:185,h:20},{x:1820,y:329,w:220,h:20},
 {x:2455,y:355,w:176,h:20},
 ...MarsArchitecture.solids
];
const spawnXs=[335,620,926,1210,1530,1870,2160,2440,2780,3070];
let player,enemies,effects,flames,bolts,view,shake,clock,won,lost,lastTime=0,acc=0,noticeTime=240;
function rand(i){let n=Math.sin(i*127.1+78.31)*43758.5453123;return n-Math.floor(n)}
function reset(){
 player={x:65,y:290,w:30,h:96,vx:0,vy:0,hp:100,facing:1,ground:false,coyote:0,attack:0,cool:0,shootCool:0,shotFlash:0,inv:0,step:0};
 enemies=spawnXs.map((x,i)=>{
  const big=i%3===2,h=big?148:110,w=big?45:27;
  const building=i===1?buildings[0]:i===4?buildings[1]:i===7?buildings[2]:null;
  const min=building?building.x+20:x-96,max=building?building.x+building.w-w-20:x+96;
  return {x,y:(building?building.y:FLOOR)-h,w,h,big,hp:big?5:2,maxHp:big?5:2,max:big?5:2,
   home:x,platform:building,patrolMin:min,patrolMax:max,face:-1,hit:0,walk:0,moving:false,
   cd:20+i*7,attackTimer:0,attackTotal:0,windup:0,active:0,hitDone:false,dead:false};
 });
 effects=[];flames=[];bolts=[];view=0;shake=0;clock=0;won=false;lost=false;noticeTime=260;
 restartBtn.style.display='none';
}
reset();
document.querySelectorAll('[data-key]').forEach(button=>{
 const key=button.dataset.key;
 button.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;button.classList.add('pressed');button.setPointerCapture(e.pointerId)});
 const release=e=>{keys[key]=false;button.classList.remove('pressed')};
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>button.addEventListener(t,release));
});
const bindings={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',Space:'jump',KeyW:'jump',KeyJ:'attack',KeyZ:'attack',KeyX:'shoot',KeyK:'shoot',ShiftLeft:'shoot'};
window.addEventListener('keydown',e=>{let key=bindings[e.code];if(key){keys[key]=true;e.preventDefault()}if(e.code==='KeyR'&&(won||lost))reset()});
window.addEventListener('keyup',e=>{let key=bindings[e.code];if(key){keys[key]=false;e.preventDefault()}});
window.addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false)});
restartBtn.addEventListener('click',reset);
function P(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function line(x1,y1,x2,y2,c,w=2){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function glow(x,y,r,color,a=.65){g.save();g.globalCompositeOperation='screen';g.globalAlpha=a;let grad=g.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,color);grad.addColorStop(1,'transparent');g.fillStyle=grad;g.fillRect(x-r,y-r,2*r,2*r);g.restore()}
function particles(x,y,count,palette,force=1){
 for(let i=0;i<count;i++){let ang=rand(i*17+clock*71)*Math.PI*2,spd=(1+rand(i*33+clock*15)*4)*force;effects.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1.1,life:18+rand(i*18+clock)*25,max:43,c:palette[Math.floor(rand(i*5+clock)*palette.length)],size:2+rand(i*7+clock)*3})}
 if(effects.length>140)effects.splice(0,effects.length-140);
}
function hurt(e,damage){e.hp-=damage;e.hit=12;shake=Math.max(shake,e.big?7:4);particles(e.x+e.w/2,e.y+e.h/2,e.big?20:12,['#ed6a45','#ffba69','#d6b7a1','#92323e'],1.15);if(e.hp<=0){e.dead=true;e.deathClock=clock;particles(e.x+e.w/2,e.y+e.h/2,28,['#a64042','#e69a59','#a1a09d'],1.6)}}
function enemyWithinWeapon(e){
 const delta=(player.x+player.w/2)-(e.x+e.w/2);
 const diffY=Math.abs((player.y+player.h*.54)-(e.y+e.h*.52));
 return delta*e.face>0 && delta*e.face<(e.big?92:62) && diffY<(e.big?75:65);
}
function damagePlayer(amount,face){
 if(player.inv>0||player.hp<=0)return false;
 player.hp=Math.max(0,player.hp-amount);player.inv=43;shake=11;
 player.vx=face*5.5;player.vy=-3.5;
 particles(player.x+player.w/2,player.y+player.h-58,19,['#f15b43','#ffd58a','#bba3a3']);
 if(player.hp<=0){lost=true;player.deathClock=clock;restartBtn.style.display='block'}
 return true;
}
function fireGun(){
 const dir=player.facing,feet=player.y+player.h;
 bolts.push({x:player.x+player.w/2+dir*37,y:feet-58,prevX:0,vx:dir*15,life:55,dir,damage:1});
 player.shootCool=17;player.shotFlash=7;shake=Math.max(shake,2);
 particles(player.x+player.w/2+dir*41,feet-58,8,['#8df5e7','#e5ffff','#f2b86e'],.6);
}
function updateBolts(){
 for(const b of bolts){
  b.prevX=b.x;b.x+=b.vx;b.life--;
  if(b.life<=0||b.x<0||b.x>LENGTH){b.life=0;continue}
  // A segment collision prevents bullets skipping narrow heretics at 60 fps.
  for(const e of enemies){
   if(e.dead)continue;
   if(b.y<e.y+6||b.y>e.y+e.h-6)continue;
   if(Math.max(b.x,b.prevX)>=e.x && Math.min(b.x,b.prevX)<=e.x+e.w){
    hurt(e,b.damage);b.life=0;
    particles(b.x,b.y,9,['#a4f9f2','#e9d3a0','#f1a96b'],.8);break;
   }
  }
 }
 bolts=bolts.filter(b=>b.life>0);
}
function updateEnemies(){
 for(const e of enemies){
  if(e.dead)continue;
  if(e.hit>0)e.hit--;
  if(e.cd>0)e.cd--;
  const dx=player.x+player.w/2-(e.x+e.w/2);
  const dy=(player.y+player.h/2)-(e.y+e.h/2);
  const aware=Math.abs(dx)<310&&Math.abs(dy)<110;
  e.moving=false;
  if(e.attackTimer>0){
   e.attackTimer--;
   const elapsed=e.attackTotal-e.attackTimer;
   // Only the weapon's ACTIVE frames cause damage. Mere contact never does.
   if(!e.hitDone&&elapsed>=e.windup&&elapsed<e.windup+e.active&&enemyWithinWeapon(e)){
    if(damagePlayer(e.big?23:12,e.face))e.hitDone=true;
   }
  }else{
   if(aware){
    e.face=dx<0?-1:1;
    if(e.cd===0&&Math.abs(dx)<(e.big?86:57)&&Math.abs(dy)<(e.big?72:60)){
     e.attackTotal=e.big?43:32;
     e.windup=e.big?27:19;
     e.active=e.big?8:6;
     e.attackTimer=e.attackTotal;
     e.cd=e.big?111:83;
     e.hitDone=false;
    }else if(Math.abs(dx)>(e.big?66:42)){
     const step=e.face*(e.big?.67:.88)*(e.hit>0?.38:1);
     e.x+=step;e.moving=true;
    }
   }else{
    const patrolStep=e.face*(e.big?.26:.35);
    e.x+=patrolStep;e.moving=true;
   }
   if(e.x<e.patrolMin){e.x=e.patrolMin;e.face=1;e.moving=false}
   if(e.x>e.patrolMax){e.x=e.patrolMax;e.face=-1;e.moving=false}
  }
  // 7-9 visually readable animation poses per second, with planted pauses while striking.
  if(e.moving)e.walk+=e.big?.029:.043;
 }
}
function update(){
 clock++;
 for(const s of effects){s.x+=s.vx;s.y+=s.vy;s.vy+=.13;s.vx*=.97;s.life--}
 effects=effects.filter(s=>s.life>0);
 if(clock%5===0)flames.push({x:view+rand(clock)*SW,y:270+rand(clock+5)*165,vx:-.4-rand(clock+8)*1.3,vy:-.5-rand(clock+3),life:45+rand(clock+4)*55});
 for(const f of flames){f.x+=f.vx;f.y+=f.vy}
 flames=flames.filter(f=>f.life-->0);if(flames.length>90)flames.shift();
 if(noticeTime>0)noticeTime--;
 if(won||lost){shake*=.83;return}
 const speed=3.9,target=((keys.right?1:0)-(keys.left?1:0))*speed;
 player.vx+=(target-player.vx)*(player.ground?.28:.15);
 if(Math.abs(player.vx)<.08)player.vx=0;
 if(Math.abs(player.vx)>.2)player.facing=Math.sign(player.vx);
 player.x=Math.max(2,Math.min(LENGTH-50,player.x+player.vx));
 if(player.ground)player.coyote=7;else player.coyote=Math.max(0,player.coyote-1);
 if(keys.jump&&player.coyote>0){
  player.vy=-12.1;player.ground=false;player.coyote=0;
  particles(player.x+14,player.y+player.h,8,['#c26b43','#a48b77']);
 }
 player.vy=Math.min(15,player.vy+.62);
 const oldY=player.y;player.y+=player.vy;player.ground=false;
 for(const a of landings){
  if(player.x+player.w>a.x+4&&player.x<a.x+a.w-4&&oldY+player.h<=a.y+12&&player.y+player.h>=a.y&&player.vy>=0){
   player.y=a.y-player.h;player.vy=0;player.ground=true;break;
  }
 }
 player.step+=Math.abs(player.vx)*.15;
 if(player.cool>0)player.cool--;
 if(player.shootCool>0)player.shootCool--;
 if(player.shotFlash>0)player.shotFlash--;
 if(player.inv>0)player.inv--;
 if(player.attack>0)player.attack--;
 if(keys.attack&&player.cool===0){
  player.attack=17;player.cool=24;shake=Math.max(shake,2);
  particles(player.x+player.w/2+player.facing*43,player.y+player.h-69,5,['#ffe5b7','#ff9a50'],.6);
  for(const e of enemies){
   if(e.dead)continue;
   const dist=(e.x+e.w/2)-(player.x+15),dy=(e.y+e.h*.52)-(player.y+player.h*.52);
   if(Math.abs(dist)<90&&Math.abs(dy)<Math.max(72,(player.h+e.h)*.42)&&dist*player.facing>-20)hurt(e,1);
  }
 }
 if(keys.shoot&&player.shootCool===0)fireGun();
 updateBolts();
 updateEnemies();
 const wanted=Math.max(0,Math.min(LENGTH-SW,player.x-280));
 view+=(wanted-view)*.085;shake*=.86;
 if(player.x>3260){
  won=true;restartBtn.style.display='block';
  particles(player.x+20,player.y+25,45,['#fad6a1','#c98848','#ffeab5'],2);
 }
}
function sky(){
 let gr=g.createLinearGradient(0,0,0,SH);gr.addColorStop(0,'#150f20');gr.addColorStop(.48,'#48242e');gr.addColorStop(1,'#aa4b37');g.fillStyle=gr;g.fillRect(0,0,SW,SH);
 glow(755-view*.018,120,240,'#a6534b',.5);
 g.fillStyle='#b35a4d';g.beginPath();g.arc(760-view*.016,138,75,0,Math.PI*2);g.fill();
 g.fillStyle='#924b4a';g.beginPath();g.arc(733-view*.016,123,42,0,Math.PI*2);g.fill();
 for(let i=0;i<75;i++){let x=(rand(i*17)*1000-clock*(.02+rand(i)*.08)+1100)%1000,y=rand(i*13)*380;P(x,y,rand(i*19)>0.8?2:1,1,'#c98a76')}
}
function background(){
 // Receding industrial districts; each layer moves at a different fraction of camera speed.
 for(let layer=0;layer<3;layer++){
   const speed=[.12,.28,.52][layer],baseline=[332,390,437][layer],shade=['#29202c','#382530','#503039'][layer];
   const shift=view*speed;
   for(let i=-2;i<39;i++){
    let x=i*118-shift%118,w=71+(i*19+layer*7)%35,h=65+(i*31+layer*83)%125;
    P(x,baseline-h,w,h,shade);P(x+8,baseline-h-24,12,28,shade);P(x+w-19,baseline-h-43,9,49,shade);
    if(layer>0){P(x+22,baseline-h+25,8,16,'#a05a49');P(x+23,baseline-h+25,3,12,'#df9b60')}
    if(layer===2){P(x+40,baseline-h-15,8,16,'#29232b');line(x+42,baseline-h-15,x+42,baseline-h-45,'#54414a',3)}
   }
   g.strokeStyle=layer===2?'#47313a':'#48313b';g.lineWidth=layer===2?7:4;
   for(let k=0;k<10;k++){let y=baseline-55-k%2*28;line(-40,y,1010,y+Math.sin(k)*9,g.strokeStyle,layer===2?6:3)}
 }
 // Far dunes and silhouettes
 g.fillStyle='#623640';g.beginPath();g.moveTo(0,423);
 for(let x=0;x<=SW+25;x+=25)g.lineTo(x,406+Math.sin((x+view*.15)*.009)*18+Math.sin((x+view*.15)*.025)*8);
 g.lineTo(SW,SH);g.lineTo(0,SH);g.fill();
}
function worldObject(x){
 let y=FLOOR;
 P(x,y-145,12,145,'#2f2932');P(x-10,y-155,32,14,'#80605a');P(x-6,y-170,24,16,'#342c35');
 P(x+3,y-131,5,80,'#7c5252');
 P(x-25,y-119,14,50,'#3f3039');P(x+23,y-106,14,50,'#3f3039');
 P(x-13,y-93,40,10,'#8a4b42');P(x-10,y-87,34,3,'#ce8b66');
 P(x+6,y-165,5,8,'#ffb268');glow(x+9,y-160,32,'#e9843d',.4);
}
function structure(){
 g.save();g.translate(-view,0);
 // A monumental temple built into the end of the level.
 const x=3260,y=192;
 P(x-40,190,175,260,'#241f2b');
 P(x-57,255,38,195,'#5a4346');P(x+110,254,37,196,'#5a4346');
 P(x-63,239,208,20,'#a36b55');P(x-32,209,150,31,'#49333c');
 P(x+1,262,82,190,'#100e19');P(x+9,273,66,179,'#4e3336');
 P(x+17,280,50,172,'#1c1822');
 for(let i=0;i<5;i++){P(x+16,296+i*29,51,5,'#7b4d43')}
 for(let i=0;i<3;i++){P(x-60+i*95,219,13,21,'#d8a367');glow(x-54+i*95,221,40,'#e88940',.6)}
 P(x-28,186,149,18,'#ba8a60');P(x-2,169,94,18,'#6a4a49');
 P(x+36,138,16,36,'#7d5f57');P(x+27,127,34,11,'#c18a62');
 glow(x+43,310,110,'#f0783e',.3);
 g.restore();
}
function ground(){
 MarsArchitecture.draw(g,view,clock);
 for(let a of landings){
   let sx=a.x-view;if(sx+a.w<0||sx>SW)continue;
   P(sx,a.y,a.w,a.h,'#252631');P(sx,a.y,a.w,8,'#86635c');
   P(sx,a.y+8,a.w,7,'#54414a');
   P(sx,a.y+15,a.w,a.h-15,'#332b37');
   for(let i=0;i<Math.ceil(a.w/38);i++){let xx=sx+i*38;
     P(xx+2,a.y+17,4,18,'#51414b');P(xx+12,a.y+1,17,2,'#bd8270');P(xx+32,a.y+4,3,3,'#d8a373');
     if(a.y===FLOOR){P(xx,a.y+35,25,40,'#292530');P(xx+10,a.y+23,4,4,'#78514b')}
   }
 }
 for(let x=220;x<LENGTH-200;x+=390){let sx=x-view;if(sx>-70&&sx<SW+60)worldObject(sx)}
 for(let x=280;x<LENGTH;x+=620){let sx=x-view;
   P(sx,FLOOR-85,8,85,'#31303a');P(sx-10,FLOOR-89,27,12,'#79544f');P(sx-22,FLOOR-112,14,20,'#aa694f');
   glow(sx-15,FLOOR-104,45,'#ed8c4d',.42);
 }
 structure();
}
function sprite(e,type){
 const kind=type==='player'?'servitor':type==='marine'?'marine':'heretic';
 const sx=e.x-view+e.w/2, sy=e.y+e.h;
 P(sx-(kind==='marine'?34:20),sy-2,kind==='marine'?68:40,5,'#100d1c77');
 MarsSprites.draw(g,e,kind,view,player,clock);
 if(kind==='servitor')glow(sx+player.facing*4,e.y+e.h-91,26,'#e14936',.48);
 else if(!e.dead)glow(sx+e.face*5,e.y+e.h-(kind==='marine'?116:87),kind==='marine'?37:23,kind==='marine'?'#eb4c69':'#ae4f54',.35);
 if(kind!=='servitor'&&!e.dead&&e.hp<e.max){
  P(e.x-view,e.y-13,e.w,4,'#221b23');
  P(e.x-view,e.y-13,e.w*e.hp/e.max,4,'#ed7456');
 }
}
function drawGun(){
 if(player.hp<=0)return;
 const x=Math.round(player.x+player.w/2-view),feet=Math.round(player.y+player.h);
 g.save();g.translate(x,feet-58);g.scale(player.facing,1);
 const recoil=player.shotFlash?4:0;
 P(-13,-1,22,9,'#141b27');P(-9,-4,26,10,'#627b83');
 P(-5,-4,11,3,'#b4cfcd');P(13-recoil,-6,17,11,'#263945');
 P(15-recoil,-4,15,7,'#709fa3');P(24-recoil,-2,9,4,'#d0d7c5');
 P(30-recoil,-5,7,11,'#1d242d');P(34-recoil,-3,5,7,'#a9d6cf');
 P(-11,7,8,10,'#a37b5b');P(-7,9,4,10,'#313540');
 P(6,-6,5,3,'#ffd99b');P(6,2,5,3,'#d6a566');
 if(player.shotFlash>0){
  const a=player.shotFlash;
  glow(38,0,27,'#66e6e3',.8);
  P(37,-9,5,18,'#b5ffff');P(31,-3,19,6,'#e3ffff');
  P(49,-2,8,4,'#8efefa');
 }
 g.restore();
}
function drawProjectiles(){
 for(const b of bolts){
  const x=b.x-view,y=b.y;
  glow(x,y,18,'#53e5e3',.48);
  P(x-5*b.dir,y-3,10,6,'#a9f8eb');
  P(x-8*b.dir,y-1,5,2,'#d8ffff');
  P(x-18*b.dir,y,8,2,'#4faeaf');
 }
}
function drawEnemyWeaponAttacks(){
 for(const e of enemies){
  if(e.dead||e.attackTimer<=0)continue;
  const elapsed=e.attackTotal-e.attackTimer,active=elapsed>=e.windup&&elapsed<e.windup+e.active;
  const x=e.x+e.w/2-view,y=e.y+e.h-(e.big?96:67);
  const reach=e.big?92:62;
  if(elapsed<e.windup){
   // A readable windup warns the player before the attack becomes dangerous.
   g.save();g.globalAlpha=.32+Math.sin(clock*.25)**2*.30;
   P(x+e.face*18,y-9,Math.max(1,reach-18),5,'#f6a968');
   g.restore();
  }else if(active){
   g.save();g.strokeStyle=e.big?'#fa608a':'#f4be88';g.lineWidth=e.big?12:7;
   g.shadowColor=e.big?'#ed457e':'#f5a968';g.shadowBlur=17;
   g.beginPath();g.moveTo(x+e.face*12,y-25);g.quadraticCurveTo(x+e.face*reach,y-18,x+e.face*reach,y+20);
   g.stroke();g.restore();
  }
 }
}
function slash(){
 if(player.attack<=0)return;
 const t=1-player.attack/17,angle=-1.15+t*2.45;
 const cx=player.x-view+15+player.facing*16,cy=player.y+player.h-69;
 g.save();g.translate(cx,cy);g.scale(player.facing,1);
 g.globalCompositeOperation='screen';g.strokeStyle='#ffe3b2';g.lineWidth=9;g.shadowColor='#ff904c';g.shadowBlur=25;
 g.beginPath();g.arc(0,0,58,angle-.40,angle+.32);g.stroke();
 g.strokeStyle='#ffffff';g.lineWidth=2;g.beginPath();g.arc(0,0,62,angle-.34,angle+.26);g.stroke();
 g.restore();
}
function foreground(){
 for(let i=0;i<17;i++){
  let x=i*240-view*1.13%240;
  P(x,0,11,30,'#15151d');P(x-4,22,20,7,'#302630');
  if(i%3===0){P(x+24,0,6,19,'#1e1b24');line(x+26,18,x+26,90,'#2f2830',3)}
 }
 for(let i=0;i<11;i++){let x=(i*190-view*1.1)%1100;g.fillStyle='#1c1621';g.fillRect(x,511,45,37)}
}
function drawHud(){
 P(18,17,234,48,'#13111bdc');P(22,20,4,40,'#e3a46c');
 g.fillStyle='#e9cead';g.font='bold 17px monospace';g.fillText('SERVITOR // HP',37,39);
 P(37,47,192,9,'#412b35');P(37,47,Math.max(0,192*player.hp/100),9,player.hp>30?'#c76e4c':'#ef3c4b');
 g.font='bold 17px monospace';g.fillText('MARS • ХРАМ МЕХАНИКУС',665,33);
 P(668,44,258,3,'#382b32');P(668,44,258*Math.min(1,player.x/(LENGTH-130)),3,'#d5a36f');
 g.fillStyle='#9fd7d3';g.font='bold 13px monospace';g.fillText('⚔ МЕЧ     ✦ БЛАСТЕР',670,70);
 if(noticeTime>0){g.save();g.globalAlpha=Math.min(1,noticeTime/35);P(252,79,460,37,'#1e151ec9');g.fillStyle='#f0bd91';g.font='bold 18px monospace';g.fillText('ПРОРВАТЬСЯ К ГЛАВНЫМ ВРАТАМ ХРАМА',267,105);g.restore()}
 if(won||lost){
  g.fillStyle='#130e19e8';g.fillRect(0,0,SW,SH);
  g.textAlign='center';g.fillStyle=won?'#f5ca8d':'#d76b63';g.font='bold 36px monospace';
  g.fillText(won?'ВРАТА ХРАМА ДОСТИГНУТЫ':'СЕРВИТОР УНИЧТОЖЕН',SW/2,228);
  g.font='bold 19px monospace';g.fillStyle='#ead6bd';g.fillText(won?'СЛАВА ОМНИССИИ':'ЗАДАНИЕ НЕ ВЫПОЛНЕНО',SW/2,270);
  g.textAlign='left';
 }
}
function draw(){
 sky();background();
 g.save();g.translate(Math.round((rand(clock*3)-.5)*shake),Math.round((rand(clock*5)-.5)*shake));
 ground();
 for(const e of enemies)if((!e.dead||clock-e.deathClock<35)&&e.x-view>-100&&e.x-view<SW+100)sprite(e,e.big?'marine':'heretic');
 if(player.inv%7<4){sprite(player,'player');drawGun();}
 slash();drawEnemyWeaponAttacks();drawProjectiles();
 for(const p of effects){g.globalAlpha=Math.max(0,p.life/p.max);P(p.x-view,p.y,p.size,p.size,p.c)}g.globalAlpha=1;
 for(const f of flames){g.globalAlpha=Math.min(1,f.life/20)*.8;P(f.x-view,f.y,2,3,'#df9a69')}g.globalAlpha=1;
 foreground();g.restore();
 // Subtle smoke and warm light vignette
 let vg=g.createRadialGradient(SW/2,SH/2,130,SW/2,SH/2,630);vg.addColorStop(0,'#00000000');vg.addColorStop(1,'#100a17b8');g.fillStyle=vg;g.fillRect(0,0,SW,SH);
 drawHud();
}
function loop(time){
 if(!lastTime)lastTime=time;let delta=Math.min(64,time-lastTime);lastTime=time;acc+=delta;
 let steps=0;while(acc>=16.667&&steps<3){update();acc-=16.667;steps++}
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
